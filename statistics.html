<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADZERO · Statistics</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;max-width:900px;font:14px Segoe UI,Arial;color:#f3f5f7;background:linear-gradient(145deg,#111a23,#1b2732)}h1{letter-spacing:2px} .sub{color:#aab5bf;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#202d38;border:1px solid #35434f;border-radius:14px;padding:16px}.k{color:#c5a66c;font-size:11px;text-transform:uppercase}.v{font-size:27px;font-weight:750;margin-top:8px}.muted{color:#aab5bf;font-size:12px;line-height:1.5}.bar{height:8px;background:#35434f;border-radius:8px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#c5a66c;width:0}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #35434f}.btn{background:#293844;color:#f5f6f7;border:1px solid #566472;border-radius:8px;padding:8px 12px;cursor:pointer}select{background:#293844;color:white;border:1px solid #566472;border-radius:8px;padding:8px}
</style></head><body><h1>ADZERO</h1><div class="sub" id="subtitle">Статистика защиты и объяснение блокировок</div><div style="margin-bottom:14px"><select id="period"><option value="1">24 часа</option><option value="7" selected>7 дней</option><option value="30">30 дней</option></select> <button class="btn" id="refresh">Обновить</button></div><div class="grid"><div class="card"><div class="k" id="reqLabel">Заблокированные запросы</div><div class="v" id="requests">0</div><div class="muted" id="reqNote">Только события, предоставленные DNR API</div></div><div class="card"><div class="k" id="domainLabel">Домены</div><div class="v" id="domains">0</div></div><div class="card"><div class="k" id="recordLabel">Записи истории</div><div class="v" id="records">0</div></div><div class="card"><div class="k" id="domLabel">Распознанные DOM-элементы</div><div class="v" id="domCount">0</div><div class="muted" id="domNote">Накопительный счётчик, не сетевые запросы</div></div></div><div class="card" style="margin-top:14px"><div class="k" id="topLabel">Частые домены</div><div id="top"></div></div><div class="card" style="margin-top:14px"><div class="k" id="explainLabel">Smart Explanation · последняя блокировка</div><div id="explain" class="muted" style="margin-top:10px">Нет данных</div></div><script src="statistics.js"></script></body></html>
